# Scheduled news collection for serverless hosting (free for public repositories).
# Needs the repository secret DATABASE_URL (Neon connection string).
name: Collect news

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    env:
      VESTNIO_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VESTNIO_GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      VESTNIO_LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Poll all sources
        run: python -m vestnio.cli ingest
