name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vestnio
          POSTGRES_PASSWORD: vestnio
          POSTGRES_DB: vestnio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vestnio" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      VESTNIO_TEST_DATABASE_URL: postgresql+asyncpg://vestnio:vestnio@localhost:5432/vestnio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio respx
      - run: python -m pytest -q

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build
