# VESTNIO source registry
#
# Fields
#   id            unique slug (stable: it is stored with every article)
#   name          display name
#   url           feed / API endpoint / listing page
#   homepage      optional, shown in the client
#   category      gaming | world | technology
#   method        rss | api | html | telegram
#   adapter       api: hackernews | guardian ; html: html_css (default) ; rss: optional
#   poll_minutes  optional, defaults to VESTNIO_DEFAULT_POLL_MINUTES (15)
#   enabled       optional, default true (disabled sources are not polled and hidden from the feed)
#   show_excerpt  optional, default true; false = headline + link only
#   language      fallback language code if the feed doesn't declare one
#   options       adapter-specific settings
#
# Only publicly offered feeds/APIs are listed. VESTNIO stores headline, short teaser,
# image URL and link — never full article text — and always links to the publisher.
# Run `python -m vestnio.cli check` to verify every entry against the live source.
# Checked and rejected: lenta.ru (robots.txt disallows), kanobu.ru (malformed feed),
# vgtimes.ru (not a feed), ixbt.com games feed (404).

defaults:
  poll_minutes: 15
  language: ru

