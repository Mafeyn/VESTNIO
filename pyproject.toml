# Used by Vercel to deploy the API (FastAPI) as one serverless function.
# Local development uses backend/requirements*.txt instead.
[project]
name = "vestnio"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "feedparser>=6.0.11",
    "sgmllib3k>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pydantic-settings>=2.3",
]

[tool.vercel]
entrypoint = "backend.server:app"
